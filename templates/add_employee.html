{% extends "base.html" %}
{% block title %}Add Employee{% endblock %}
{% block content %}
<div class="form-card">
    <h2 class="mb-4">Add Employee</h2>
    <form method="POST">
        <div class="mb-3"><label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Department</label>
            <select name="department" class="form-select" required>
                <option value="">Select department</option>
                <option>IT</option><option>HR</option><option>Finance</option>
                <option>Sales</option><option>Marketing</option>
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Position</label>
            <input type="text" name="position" class="form-control" placeholder="e.g. Python Developer" required></div>
        <div class="mb-4"><label class="form-label">Salary</label>
            <input type="number" name="salary" class="form-control" step="0.01" min="0" required></div>
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary">Save Employee</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
