{% extends "base.html" %}
{% block title %}Edit Employee{% endblock %}
{% block content %}
<div class="form-card">
    <h2 class="mb-4">Edit Employee</h2>
    <form method="POST">
        <div class="mb-3"><label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-control" value="{{ employee['name'] }}" required></div>
        <div class="mb-3"><label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ employee['email'] }}" required></div>
        <div class="mb-3"><label class="form-label">Department</label>
            <select name="department" class="form-select" required>
                {% for dept in ["IT", "HR", "Finance", "Sales", "Marketing"] %}
                    <option {% if employee['department'] == dept %}selected{% endif %}>{{ dept }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3"><label class="form-label">Position</label>
            <input type="text" name="position" class="form-control" value="{{ employee['position'] }}" required></div>
        <div class="mb-4"><label class="form-label">Salary</label>
            <input type="number" name="salary" class="form-control" step="0.01" min="0" value="{{ employee['salary'] }}" required></div>
        <div class="d-flex flex-wrap gap-2">
            <button class="btn btn-primary">Update Employee</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
